apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-adminer
  namespace: sandbox
  labels:
    app: sandbox-adminer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-adminer
  template:
    metadata:
      labels:
        app: sandbox-adminer
    spec:
      containers:
        - name: sandbox-adminer
          image: adminer
          ports:
            - containerPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  namespace: sandbox
  name: sandbox-adminer-service
spec:
  selector:
    app: sandbox-adminer
  ports:
    - port: 8080
      targetPort: 8080
  type: NodePort

--- ## MONGO

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-mongo-express
  namespace: sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-mongo-express
  template:
    metadata:
      labels:
        app: sandbox-mongo-express
    spec:
      containers:
        - name: sandbox-mongo-express
          image: mongo-express:latest
          ports:
            - containerPort: 8081
          env:
#            - ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_DB_USER}
#            - ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_DB_PASSWORD}
#            - ME_CONFIG_BASICAUTH_ENABLED: true
#            - ME_CONFIG_MONGODB_URL: "mongodb://admin:example@mongo:${MONGO_DB_PORT}/?authSource=admin"
            - name: ME_CONFIG_BASICAUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sandbox-secrets
                  key: MONGO_DB_USER
            - name: ME_CONFIG_BASICAUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sandbox-secrets
                  key: MONGO_DB_PASSWORD
            - name: ME_CONFIG_BASICAUTH_ENABLED
              value: "true"
            - name: ME_CONFIG_MONGODB_URL
              value: "mongodb://admin:example@sandbox-mongodb-service:27017/?authSource=admin"

---

apiVersion: v1
kind: Service
metadata:
  name: sandbox-mongo-express-service
  namespace: sandbox
spec:
  selector:
    app: sandbox-mongo-express
  ports:
    - port: 8081
      targetPort: 8081
  type: NodePort
