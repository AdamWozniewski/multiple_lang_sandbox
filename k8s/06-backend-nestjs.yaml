apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-backend-nestjs
  namespace: sandbox
  labels:
    app: sandbox-backend-nestjs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-backend-nestjs
  template:
    metadata:
      labels:
        app: sandbox-backend-nestjs
    spec:
      containers:
        - name: sandbox-backend-nestjs
          image: sandbox-backend-nestjs:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: sandbox-config
            - secretRef:
                name: sandbox-secrets
          env:
            - name: PORT
              value: "3001"
            - name: NEST_PORT
              value: "3001"
      initContainers:
        - name: sandbox-wait-for-postgres
          image: busybox:1.36
          command:
            - "sh"
            - "-c"
            - "until nc -z sandbox-postgres-service 5432; do echo 'Oczekiwanie na POSTGRES'; sleep 2; done"

---

apiVersion: v1
kind: Service
metadata:
  name: sandbox-backend-nestjs-service
  namespace: sandbox
spec:
  selector:
    app: sandbox-backend-nestjs
  ports:
    - port: 3001
      targetPort: 3001
  type: NodePort



