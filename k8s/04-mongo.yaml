apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sandbox-mongodbdata
  namespace: sandbox
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-mongodb
  namespace: sandbox
  labels:
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: sandbox-mongodb
          image: mongo:latest
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  key: MONGO_DB_USER
                  name: sandbox-secrets
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: MONGO_DB_PASSWORD
                  name: sandbox-secrets
          volumeMounts:
            - mountPath: /data/db
              name: sandbox-mongodbdata
      volumes:
        - name: sandbox-mongodbdata
          persistentVolumeClaim:
            claimName: sandbox-mongodbdata

---

apiVersion: v1
kind: Service
metadata:
  namespace: sandbox
  name: sandbox-mongodb-service
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP