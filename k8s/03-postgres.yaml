apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sandbox-pgdata
  namespace: sandbox
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-postgres
  namespace: sandbox
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: sandbox-postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_DB_USER
                  name: sandbox-secrets
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_DB_PASSWORD
                  name: sandbox-secrets
          volumeMounts:
            - mountPath: /var/lib/postgres/data
              name: sandbox-pgdata
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - admin
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: sandbox-pgdata
          persistentVolumeClaim:
            claimName: sandbox-pgdata

---

apiVersion: v1
kind: Service
metadata:
  name: sandbox-postgres-service
  namespace: sandbox
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
