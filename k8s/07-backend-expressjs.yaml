apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-backend-expressjs
  namespace: sandbox
  labels:
    app: sandbox-backend-expressjs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-backend-expressjs
  template:
    metadata:
      labels:
        app: sandbox-backend-expressjs
    spec:
      containers:
        - name: sandbox-backend-expressjs
          image: sandbox-backend-expressjs:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: sandbox-config
            - secretRef:
                name: sandbox-secrets
          env:
            - name: PORT
              value: "3000"

---

apiVersion: v1
kind: Service
metadata:
  name: sandbox-backend-expressjs-service
  namespace: sandbox
spec:
  selector:
    app: sandbox-backend-expressjs
  ports:
    - port: 3000
      targetPort: 3000
  type: NodePort