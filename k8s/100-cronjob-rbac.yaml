apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-rbac-monitor
  namespace: sandbox

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-rbac-monitor-reader
  namespace: sandbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-rbac-monitor-reader-binding
  namespace: sandbox
subjects:
  - kind: ServiceAccount
    name: sandbox-rbac-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-rbac-monitor-reader