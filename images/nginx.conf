events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  server {
    listen 80;
    listen [::]:80;

    #root /var/www/$NGINX_LOCALISATION/html;
    #index index.html index.htm index.nginx-debian.html;

    server_name $NGINX_HOST_NAME www.$NGINX_HOST_NAME;

    localtion / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        #try_files $uri $uri/ =404;
    }
  }

  server {
    listen 443 ssl http2;
    server_name __moja_nazwa_sererka__ www.__moja_nazwa_sererka__;

    ssl_certificate     /etc/letsencrypt/live/__moja_nazwa_sererka__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__moja_nazwa_sererka__/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
      proxy_pass         http://web:3000;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
    }
  }
}