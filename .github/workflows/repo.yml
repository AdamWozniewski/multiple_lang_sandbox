name: sandbox-ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:

jobs:
  test-nest-js:
    name: Test nestjs-api
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: cd apps/recipe-api && bun install
      - name: Build
        run: cd apps/recipe-api && bun run build
      - name: Test
        run: cd apps/recipe-api && bun run test:run
        env:
          NODE_ENV: test
          POSTGRES_DB_HOST: localhost
          POSTGRES_DB_PORT: 5432
          POSTGRES_DB_USER: admin
          POSTGRES_DB_NAME: postgres
  build-docker:
    name: Build Docker Images
    needs: test-nest-js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build recipe-api
        run: docker build -t recipe-api:${{ github.sha }} ./apps/recipe-api
      - name: Build backend
        run: docker build -t backend:${{ github.sha }} ./apps/backend

